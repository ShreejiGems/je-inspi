<svg width="40" height="40" viewBox="0 0 40 40" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Outer hexagon -->
  <polygon points="20,3 34,11 34,29 20,37 6,29 6,11"
           stroke="black" stroke-width="1.5" fill="none"/>

  <!-- Inner hexagon -->
  <polygon points="20,9 29,14 29,26 20,31 11,26 11,14"
           stroke="black" stroke-width="1" fill="none"/>

  <!-- Facet lines -->
  <line x1="20" y1="3" x2="20" y2="37" stroke="black" stroke-width="0.8"/>
  <line x1="6" y1="11" x2="34" y2="29" stroke="black" stroke-width="0.8"/>
  <line x1="34" y1="11" x2="6" y2="29" stroke="black" stroke-width="0.8"/>

</svg>
