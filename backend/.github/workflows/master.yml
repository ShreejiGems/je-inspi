name: Build JE-Inspi API manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build API
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f backend/package.json ]; then
            cd backend
          elif [ -f je-inspi/backend/package.json ]; then
            cd je-inspi/backend
          fi
          npm ci
          npx prisma generate
          npm run build
